<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Class 3</title>
    <link rel="stylesheet" href="./bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <style>
        html,body{
            height: 100%;
            width: 100%;

</head>
<body>

            <div class="col-1 bg-secondary">8</div>

        <br>
        <div class="row">

                <div class="card">
                    <img src="./card img.jpg" alt="">
                    <div class="card-body">
                        <h5 class="card-title">Card Title</h5>
                        <p class="card-text">
                        Rerum excepturi perspiciatis tempora autem sed
                         earum. Delectus repellat earum officiis totam.

                </div>
            </div>
        </div>
    </div>

<script src="./bootstrap-5.3.8-dist/js/bootstrap.min.js" ></script>

</html>
